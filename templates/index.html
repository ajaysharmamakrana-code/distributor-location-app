<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Distributor Location Capture</title>

<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
h2{margin:0 0 10px}
.note{font-size:13px;color:#555;margin-bottom:10px;line-height:1.4}
label{display:block;margin-top:14px;font-weight:700}
select,input,button{width:100%;padding:12px;margin-top:7px;border-radius:10px;border:1px solid #ccd2d8;font-size:16px}
button{border:0;font-weight:700;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
#gpsBtn{background:#e9eef5}
#submitBtn{background:#111827;color:#fff}
#downloadBtn{background:#e8f7ea}
#clearBtn{background:#f7eeee}
.meta{padding:10px 12px;background:#f7f8fa;border-radius:10px;margin-top:10px;line-height:1.55}
.ok{color:green;font-weight:700}
.bad{color:#b91c1c;font-weight:700}
.status{margin-top:14px;line-height:1.4}
.small{font-size:13px;color:#666}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h2>Distributor Location Capture</h2>
<div class="note">Data aur photo sirf isi device/browser me local save honge. Excel download karte waqt photo Excel me embed ho jayegi.</div>

<label>1. Select SO</label>
<select id="so">
  <option value="">Select SO</option>
  {% for so in sos %}<option value="{{ so }}">{{ so }}</option>{% endfor %}
</select>

<label>2. Select Distributor</label>
<select id="dist" disabled><option value="">Select Distributor</option></select>

<div class="meta">
  <div><b>ERP ID:</b> <span id="erp">-</span></div>
  <div><b>City:</b> <span id="city">-</span></div>
  <div><b>Status:</b> <span id="distStatus">-</span></div>
</div>

<label>3. Take Photo</label>
<input id="photo" type="file" accept="image/*" capture="environment">

<label>4. Capture GPS</label>
<button id="gpsBtn" type="button">📍 Get Current Location</button>

<div class="meta">
  <div><b>Latitude:</b> <span id="lat">-</span></div>
  <div><b>Longitude:</b> <span id="lon">-</span></div>
  <div><b>Accuracy:</b> <span id="acc">-</span></div>
</div>

<button id="submitBtn" disabled>Submit & Mark Completed</button>
<div id="msg" class="status"></div>

<hr style="margin:20px 0;border:none;border-top:1px solid #ddd">
<div class="small">Completed on this device: <b><span id="count">0</span></b></div>
<button id="downloadBtn" type="button">⬇️ Download My Excel Report (With Photos)</button>
<button id="clearBtn" type="button">🗑️ Clear This Device Data</button>
</div></div>

<script>
const MASTER={{ master_rows|tojson }};
const soEl=document.getElementById('so'),distEl=document.getElementById('dist'),
erpEl=document.getElementById('erp'),cityEl=document.getElementById('city'),
statusEl=document.getElementById('distStatus'),photoEl=document.getElementById('photo'),
gpsBtn=document.getElementById('gpsBtn'),submitBtn=document.getElementById('submitBtn'),
downloadBtn=document.getElementById('downloadBtn'),clearBtn=document.getElementById('clearBtn'),
msg=document.getElementById('msg'),countEl=document.getElementById('count');

let currentList=[],selected=null,gps={lat:null,lon:null,acc:null};

function key(){return 'dist_location_capture_v3'}
function getRecords(){try{return JSON.parse(localStorage.getItem(key())||'[]')}catch(e){return[]}}
function saveRecords(r){localStorage.setItem(key(),JSON.stringify(r))}
function isCompleted(erp){return getRecords().some(r=>String(r["Distributor Erp Id"])===String(erp))}
function updateCount(){countEl.textContent=getRecords().length}
function refreshSubmit(){submitBtn.disabled=!(soEl.value&&selected&&!isCompleted(selected["Distributor Erp Id"])&&photoEl.files.length&&gps.lat!==null&&gps.lon!==null)}
function resetCapture(){gps={lat:null,lon:null,acc:null};document.getElementById('lat').textContent='-';document.getElementById('lon').textContent='-';document.getElementById('acc').textContent='-';photoEl.value='';refreshSubmit()}
function renderDistributors(){distEl.innerHTML='<option value="">Select Distributor</option>';currentList=MASTER.filter(r=>r.SO===soEl.value);currentList.forEach((d,i)=>{const o=document.createElement('option');o.value=i;o.textContent=d["Distributor Name"]+(isCompleted(d["Distributor Erp Id"])?' ✅ Completed':'');distEl.appendChild(o)});distEl.disabled=!soEl.value}
function refreshSelectedUI(){if(!selected){erpEl.textContent=cityEl.textContent=statusEl.textContent='-'}else{erpEl.textContent=selected["Distributor Erp Id"];cityEl.textContent=selected.City||'-';statusEl.innerHTML=isCompleted(selected["Distributor Erp Id"])?'<span class="ok">✅ Completed</span>':'Pending'}refreshSubmit()}

function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open('DistributorPhotoDB',1);
    req.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains('photos')) db.createObjectStore('photos');
    };
    req.onsuccess=e=>resolve(e.target.result);
    req.onerror=e=>reject(e.target.error);
  });
}
async function savePhoto(erp,file){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction('photos','readwrite');
    tx.objectStore('photos').put(file,String(erp));
    tx.oncomplete=()=>{db.close();resolve()};
    tx.onerror=e=>{db.close();reject(e.target.error)};
  });
}
async function getPhoto(erp){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction('photos','readonly');
    const req=tx.objectStore('photos').get(String(erp));
    req.onsuccess=()=>{db.close();resolve(req.result||null)};
    req.onerror=e=>{db.close();reject(e.target.error)};
  });
}
async function clearPhotos(){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction('photos','readwrite');
    tx.objectStore('photos').clear();
    tx.oncomplete=()=>{db.close();resolve()};
    tx.onerror=e=>{db.close();reject(e.target.error)};
  });
}
function blobToBase64(blob){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onloadend=()=>resolve(reader.result);
    reader.onerror=reject;
    reader.readAsDataURL(blob);
  });
}

soEl.addEventListener('change',()=>{selected=null;resetCapture();renderDistributors();refreshSelectedUI();msg.textContent=''});
distEl.addEventListener('change',()=>{selected=distEl.value===''?null:currentList[Number(distEl.value)];resetCapture();refreshSelectedUI();msg.textContent=''});
photoEl.addEventListener('change',refreshSubmit);

gpsBtn.addEventListener('click',()=>{
  msg.textContent='';
  if(!navigator.geolocation){msg.innerHTML='<span class="bad">GPS is not supported in this browser.</span>';return}
  gpsBtn.disabled=true;gpsBtn.textContent='Getting location...';
  navigator.geolocation.getCurrentPosition(pos=>{
    gps={lat:pos.coords.latitude,lon:pos.coords.longitude,acc:pos.coords.accuracy};
    document.getElementById('lat').textContent=gps.lat.toFixed(6);
    document.getElementById('lon').textContent=gps.lon.toFixed(6);
    document.getElementById('acc').textContent=Math.round(gps.acc)+' m';
    gpsBtn.disabled=false;gpsBtn.textContent='📍 Refresh Current Location';refreshSubmit();
  },err=>{
    gpsBtn.disabled=false;gpsBtn.textContent='📍 Get Current Location';
    msg.innerHTML='<span class="bad">Location permission/GPS failed. Please allow Location and try again.</span>';refreshSubmit();
  },{enableHighAccuracy:true,timeout:20000,maximumAge:0});
});

submitBtn.addEventListener('click',async()=>{
  if(!selected||!photoEl.files.length||gps.lat===null||gps.lon===null)return;
  const erp=selected["Distributor Erp Id"];
  if(isCompleted(erp)){msg.innerHTML='<span class="bad">This distributor is already completed on this device.</span>';return}

  submitBtn.disabled=true;
  submitBtn.textContent='Saving...';

  try{
    await savePhoto(erp,photoEl.files[0]);
    const records=getRecords();
    records.push({
      "SO":selected.SO,
      "Distributor Name":selected["Distributor Name"],
      "Distributor Erp Id":erp,
      "City":selected.City||"",
      "Latitude":Number(gps.lat.toFixed(6)),
      "Longitude":Number(gps.lon.toFixed(6)),
      "GPS Accuracy (m)":Math.round(gps.acc||0),
      "Date Time":new Date().toLocaleString()
    });
    saveRecords(records);
    msg.innerHTML='<span class="ok">✅ Saved on this device with photo.</span>';
    updateCount();renderDistributors();
    const idx=currentList.findIndex(d=>String(d["Distributor Erp Id"])===String(erp));
    if(idx>=0)distEl.value=String(idx);
    selected=currentList[idx]||selected;refreshSelectedUI();resetCapture();
  }catch(e){
    msg.innerHTML='<span class="bad">Photo save failed. Please try again.</span>';
  }finally{
    submitBtn.textContent='Submit & Mark Completed';refreshSubmit();
  }
});

downloadBtn.addEventListener('click',async()=>{
  let records=getRecords();
  if(!records.length){msg.innerHTML='<span class="bad">No completed data available on this device.</span>';return}
  const selectedSO=soEl.value;
  if(selectedSO)records=records.filter(r=>r.SO===selectedSO);
  if(!records.length){msg.innerHTML='<span class="bad">No completed data found for selected SO.</span>';return}

  downloadBtn.disabled=true;
  downloadBtn.textContent='Preparing Excel with photos...';

  try{
    const wb=new ExcelJS.Workbook();
    const ws=wb.addWorksheet('Location Report');

    ws.columns=[
      {header:'SO',key:'so',width:24},
      {header:'Distributor Name',key:'name',width:30},
      {header:'Distributor ERP ID',key:'erp',width:18},
      {header:'City',key:'city',width:18},
      {header:'Latitude',key:'lat',width:14},
      {header:'Longitude',key:'lon',width:14},
      {header:'GPS Accuracy (m)',key:'acc',width:18},
      {header:'Date Time',key:'dt',width:24},
      {header:'Photo',key:'photo',width:25}
    ];

    ws.getRow(1).font={bold:true};

    for(let i=0;i<records.length;i++){
      const r=records[i];
      const rowNum=i+2;
      ws.addRow({
        so:r["SO"],
        name:r["Distributor Name"],
        erp:r["Distributor Erp Id"],
        city:r["City"],
        lat:r["Latitude"],
        lon:r["Longitude"],
        acc:r["GPS Accuracy (m)"],
        dt:r["Date Time"],
        photo:''
      });
      ws.getRow(rowNum).height=95;

      const blob=await getPhoto(r["Distributor Erp Id"]);
      if(blob){
        const dataUrl=await blobToBase64(blob);
        let ext='jpeg';
        if(blob.type.includes('png')) ext='png';
        const imageId=wb.addImage({base64:dataUrl,extension:ext});
        ws.addImage(imageId,{
          tl:{col:8.1,row:rowNum-1+0.1},
          ext:{width:120,height:90}
        });
      }
    }

    const buffer=await wb.xlsx.writeBuffer();
    const safeSO=(selectedSO||'All_SO').replace(/[\\/:*?"<>|]/g,'_');
    saveAs(new Blob([buffer],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),
           `Distributor_Location_${safeSO}.xlsx`);

    msg.innerHTML='<span class="ok">✅ Excel downloaded with photos.</span>';
  }catch(e){
    console.error(e);
    msg.innerHTML='<span class="bad">Excel generation failed. Please try again.</span>';
  }finally{
    downloadBtn.disabled=false;
    downloadBtn.textContent='⬇️ Download My Excel Report (With Photos)';
  }
});

clearBtn.addEventListener('click',async()=>{
  if(!confirm('Clear all captured distributor data and photos from this device/browser?'))return;
  localStorage.removeItem(key());
  await clearPhotos();
  selected=null;resetCapture();renderDistributors();refreshSelectedUI();updateCount();
  msg.innerHTML='<span class="ok">Device data and photos cleared.</span>';
});

updateCount();
</script>
</body>
</html>
